name: Build Ubuntu image

on:
  release:
    types: [released]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ vars.GHCR_USERNAME }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        file: images/ubuntu/Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ghcr.io/${{ vars.GHCR_USERNAME }}/actions-ubuntu:${{ github.ref_name }}

  library:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Create library archive
      shell: bash
      working-directory: library
      run: |
        tar -czf "$RUNNER_TEMP/library.tar.gz" .

    - name: Upload library archive
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload '${{ github.ref_name }}' "$ENV:RUNNER_TEMP/library.tar.gz"
