on:
  workflow_call:
    inputs:
      index_repository:
        description: 'Conan index repository name'
        type: string
        default: ${{ github.repository_owner }}/conan-index
      setup:
        type: string
      base_ref:
        description: Base ref to check the branch against. Defaults to the pull request base branch.
        type: string
      timeout:
        description: Timeout in minutes for each job.
        type: number
        default: 60

env:
  BASE_REF: ${{ inputs.base_ref || format('origin/{0}', github.base_ref) }}
  VSM_CXX_PROJECT_SETUP: ${{ inputs.setup }}

jobs:
  cxx-check-branch-linux:
    name: Linux

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vasama/actions-ubuntu:v0_5

    timeout-minutes: ${{ inputs.timeout }}

    steps:
    - uses: vasama/actions/setup@main
    - uses: vasama/actions/setup-conan-index@main
      with:
        index_repository: ${{ inputs.index_repository }}

    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - uses: vasama/actions/check-branch-history@main
      with:
        base_ref: ${{ env.BASE_REF }}

    - name: Check branch
      shell: pwsh
      run: |
        & "$ENV:RUNNER_TEMP/vsm-actions/scripts/Test-CxxProjectBranch.ps1" -BaseRef $ENV:BASE_REF

  cxx-check-branch-windows:
    name: Windows

    runs-on: windows-2025-vs2026

    timeout-minutes: ${{ inputs.timeout }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - uses: vasama/actions/check-branch-history@main
      with:
        base_ref: ${{ env.BASE_REF }}

    - uses: vasama/actions/setup@main
    - uses: vasama/actions/setup-conan-windows@main
    - uses: vasama/actions/setup-conan-index@main
      with:
        index_repository: ${{ inputs.index_repository }}

    - name: Check branch
      shell: pwsh
      run: |
        & "$ENV:RUNNER_TEMP/vsm-actions/scripts/Test-CxxProjectBranch.ps1" -BaseRef $ENV:BASE_REF
