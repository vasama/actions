on:
  workflow_call:
    secrets:
      CONAN_INDEX_TOKEN:
        required: true

jobs:
  trigger-conan-index:
    runs-on: ubuntu-latest
    name: "Trigger conan-index workflow"

    permissions: {}

    steps:
    - uses: vasama/actions/setup@main

    - uses: vasama/actions/cxx-conan-index-release@main
      with:
        token: ${{ secrets.CONAN_INDEX_TOKEN }}
        package_base: ${{ github.event.repository.name }}
