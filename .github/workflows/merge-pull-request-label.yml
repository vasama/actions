name: Merge pull request label

on:
  workflow_call:
    inputs:
      label:
        description: Merge marker label
        type: string
        default: merge
      workflow:
        description: File name of the workflow to dispatch
        type: string
        default: merge-pull-request.yml

permissions:
  contents: read

jobs:
  authorize:
    if: github.event.label.name == inputs.label
    runs-on: ubuntu-latest
    steps:
    - uses: vasama/actions/gh-check-actor-role@main

  dispatch:
    needs: authorize

    permissions:
      actions: write

    runs-on: ubuntu-latest
    steps:
    - name: Dispatch the merge
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $true

        gh workflow run $ENV:WORKFLOW `
          --repo '${{ github.repository }}' `
          --ref $ENV:DEFAULT_BRANCH `
          -f 'pull_request=${{ github.event.pull_request.number }}' `
          -f 'head_sha=${{ github.event.pull_request.head.sha }}' `
          -f "base_ref=$ENV:BASE_REF"

  # The label only triggers the merge, and is removed whether or not the merge could be dispatched:
  cleanup:
    needs: [authorize, dispatch]
    if: always() && github.event.label.name == inputs.label

    permissions:
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
    - uses: vasama/actions/gh-remove-label@main
      with:
        label: ${{ inputs.label }}
