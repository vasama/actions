name: Merge pull request

on:
  workflow_call:
    inputs:
      pull_request:
        description: Pull request number
        type: number
        required: true
      head_sha:
        description: Expected pull request head commit
        type: string
        required: true
      base_ref:
        description: Expected pull request base branch
        type: string
        required: true

permissions:
  contents: read

jobs:
  merge:
    permissions:
      contents: write
      pull-requests: write

    concurrency:
      group: merge-queue-${{ inputs.base_ref }}
      queue: max

    env:
      GH_TOKEN: ${{ github.token }}
      PULL_REQUEST: ${{ inputs.pull_request }}
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_REF: ${{ inputs.base_ref }}

    runs-on: ubuntu-latest
    steps:
    - name: Wait for the pull request to become mergeable
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true

        function Fail($Message) {
          Write-Output "::error::$Message"
          exit 1
        }

        for ($Attempt = 1; $true; ++$Attempt) {
          $PullRequest = gh api "repos/${{ github.repository }}/pulls/$ENV:PULL_REQUEST" | ConvertFrom-Json

          if ($PullRequest.state -ne 'open') {
            Fail 'The pull request is no longer open.'
          }
          if ($PullRequest.head.sha -ne $ENV:HEAD_SHA) {
            Fail 'The pull request head has changed since it was labeled for merge.'
          }
          if ($PullRequest.base.ref -ne $ENV:BASE_REF) {
            Fail 'The pull request base has changed since it was labeled for merge.'
          }
          if ($PullRequest.mergeable_state -eq 'clean') {
            break
          }
          if ($Attempt -ge 12) {
            Fail "The pull request is not mergeable: $($PullRequest.mergeable_state)"
          }

          Start-Sleep -Seconds 5
        }

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Push pull request head
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true

        git fetch origin "refs/pull/$ENV:PULL_REQUEST/head"

        if ((git rev-parse FETCH_HEAD) -ne $ENV:HEAD_SHA) {
          Write-Output '::error::The pull request head has changed after merge checks were evaluated.'
          exit 1
        }

        git push origin "${ENV:HEAD_SHA}:refs/heads/$ENV:BASE_REF"

    - name: Report the failure
      if: failure()
      shell: pwsh
      run: |
        gh pr comment $ENV:PULL_REQUEST `
          --repo '${{ github.repository }}' `
          --body 'Merge failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
