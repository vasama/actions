name: Merge pull request

on:
  workflow_call:
    inputs:
      label:
        description: Merge queue marker label
        type: string
        default: merge
      timeout:
        description: Maximum time in minutes to wait for the pull request to become mergeable.
        type: number
        default: 300

permissions:
  contents: read

jobs:
  authorize:
    if: github.event.label.name == inputs.label
    runs-on: ubuntu-latest
    steps:
    - uses: vasama/actions/check-actor-role@main

  merge:
    needs: authorize

    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read

    concurrency:
      group: merge-queue-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ github.token }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}

    runs-on: ubuntu-latest
    steps:
    - name: Wait for the pull request to become mergeable
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true

        function Fail($Message) {
          Write-Output "::error::$Message"
          exit 1
        }

        $FailedConclusions = @('failure', 'cancelled', 'timed_out', 'startup_failure')

        # Check results from before this run (e.g. from a previous attempt) are ignored.
        $StartTime = (gh api 'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}' | ConvertFrom-Json).run_started_at
        $Deadline = (Get-Date).AddMinutes(${{ inputs.timeout }})

        while ($true) {
          $PullRequest = gh api 'repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}' | ConvertFrom-Json

          if ($PullRequest.state -ne 'open') {
            Fail 'The pull request is no longer open.'
          }
          if ($PullRequest.head.sha -ne '${{ github.event.pull_request.head.sha }}') {
            Fail 'The pull request head has changed since it was queued for merge.'
          }
          if ($PullRequest.mergeable_state -eq 'dirty') {
            Fail 'The pull request has merge conflicts.'
          }
          if ($PullRequest.mergeable -eq $true -and $PullRequest.mergeable_state -eq 'clean') {
            break
          }

          $FailedChecks = gh api --paginate `
            'repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs?filter=latest&per_page=100' `
            --jq '.check_runs[] | select(.status == "completed") | {name, conclusion, completed_at}' |
            ForEach-Object { ConvertFrom-Json $_ } |
            Where-Object { $_.completed_at -ge $StartTime -and $FailedConclusions -contains $_.conclusion }

          if ($FailedChecks) {
            Fail "Checks failed: $(($FailedChecks | ForEach-Object { $_.name }) -join ', ')"
          }

          if ((Get-Date) -ge $Deadline) {
            Fail "The pull request did not become mergeable within ${{ inputs.timeout }} minutes."
          }

          Start-Sleep -Seconds 60
        }

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Push pull request head
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true

        git fetch origin 'refs/pull/${{ github.event.pull_request.number }}/head'

        if ((git rev-parse FETCH_HEAD) -ne '${{ github.event.pull_request.head.sha }}') {
          Write-Output '::error::The pull request head has changed after merge checks were evaluated.'
          exit 1
        }

        git push origin "${{ github.event.pull_request.head.sha }}:refs/heads/$ENV:BASE_REF"

  cleanup:
    needs: merge
    if: always() && github.event.label.name == inputs.label

    permissions:
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
    - name: Remove the merge label
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        LABEL: ${{ inputs.label }}
      run: |
        $Label = [uri]::EscapeDataString($ENV:LABEL)
        gh api --method DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/$Label" | Out-Null

        if ($LastExitCode -ne 0) {
          Write-Output "::warning::Unable to remove the label '$ENV:LABEL'."
        }

        # The label may already have been removed.
        exit 0
