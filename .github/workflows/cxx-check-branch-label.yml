name: Check branch label

on:
  workflow_call:
    inputs:
      label:
        description: Check marker label
        type: string
        default: check-branch
      workflow:
        description: File name of the check workflow
        type: string
        default: cxx-check-branch.yml

permissions: {}

jobs:
  rerun:
    if: github.event.label.name == inputs.label

    permissions:
      actions: write

    runs-on: ubuntu-latest
    steps:
    - name: Re-run the check
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $true

        $Runs = gh run list `
          --repo '${{ github.repository }}' `
          --workflow $ENV:WORKFLOW `
          --event pull_request `
          --commit '${{ github.event.pull_request.head.sha }}' `
          --limit 1 `
          --json databaseId |
          ConvertFrom-Json

        if (!$Runs) {
          Write-Output '::error::No check workflow run found for the pull request head.'
          exit 1
        }

        $PSNativeCommandUseErrorActionPreference = $false
        gh run rerun $Runs[0].databaseId --repo '${{ github.repository }}'

        if ($LastExitCode -ne 0) {
          Write-Output '::warning::Unable to re-run the check workflow.'
        }

        exit 0
