name: GitHub remote access

on:
  # TEMPORARY: registers the workflow from the feature branch so it can be dispatched. Remove after the first push.
  push:
    branches: [feature/gh-remote-access]
  workflow_dispatch:
    inputs:
      platform:
        description: Runner platform
        type: choice
        required: true
        options:
        - ubuntu
        - windows
        - macos
      timeout-minutes:
        description: Minutes to wait for release before continuing the job. Zero waits indefinitely.
        type: string
        default: '30'

permissions: {}

jobs:
  remote-access:
    name: Remote access - ${{ inputs.platform }}
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    runs-on: ${{ inputs.platform }}-latest

    steps:
    - uses: actions/checkout@v7

    - uses: ./gh-remote-access
      with:
        oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
