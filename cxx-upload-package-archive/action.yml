name: 'vasama/actions: cxx-upload-package-archive'
description: 'Upload C++ package archive'
author: 'Lauri Vasama'

inputs:
  release_tag:
    required: true
  archive_name:
    description: 'Name of the archive file'
    required: true
  package_path:
    description: 'Path for the '
    required: true

outputs:
  archive_url:
    description: 'Package archive URL'
    value: ${{ steps.upload.outputs.archive_url }}
  archive_hash:
    description: 'Package archive SHA-256 hash'
    value: ${{ steps.archive.outputs.archive_hash }}

runs:
  using: composite
  steps:
  - name: Create package archive
    id: archive
    shell: pwsh
    env:
      ARCHIVE_NAME: ${{ inputs.archive_name }}
      PACKAGE_PATH: ${{ inputs.package_path }}
    run: |
      $PSNativeCommandUseErrorActionPreference = $true

      $Python = & "$ENV:RUNNER_TEMP/vsm-actions/scripts/Utilities/New-PythonEnvironment.ps1" -Path "$ENV:RUNNER_TEMP/vsm-actions-venv"

      $ArchivePath = "$ENV:RUNNER_TEMP/$ENV:ARCHIVE_NAME"
      & $Python "$ENV:RUNNER_TEMP/vsm-actions/scripts/Python/Conan/make_package_archive.py" --package-path $ENV:PACKAGE_PATH --archive-path $ArchivePath
      $ArchiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $ArchivePath).Hash.ToLowerInvariant()

      "archive_path=$ArchivePath" | Out-File -Append $ENV:GITHUB_OUTPUT
      "archive_hash=$ArchiveHash" | Out-File -Append $ENV:GITHUB_OUTPUT

  - name: Upload package archive
    id: upload
    shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARCHIVE_NAME: ${{ inputs.archive_name }}
      ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
    run: |
      $PSNativeCommandUseErrorActionPreference = $true

      gh release upload $ENV:RELEASE_TAG $ENV:ARCHIVE_PATH --repo '${{ github.repository }}'

      $Assets = (gh release view $ENV:RELEASE_TAG --repo '${{ github.repository }}' --json assets | ConvertFrom-Json).assets
      $ArchiveUrl = ($Assets | Where-Object { $_.name -eq $ENV:ARCHIVE_NAME }).url

      "archive_url=$ArchiveUrl" | Out-File -Append $ENV:GITHUB_OUTPUT
