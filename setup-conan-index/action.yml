name: 'vasama/actions: setup-conan-index'
description: 'Download and set up a Conan index repository as a local Conan remote'
author: 'Lauri Vasama'

inputs:
  index_repository:
    description: 'Conan index repository name'
    default: ${{ github.repository_owner }}/conan-index

runs:
  using: composite
  steps:
  - name: Download Conan index
    shell: pwsh
    env:
      INDEX_REPOSITORY: ${{ inputs.index_repository }}
    run: |
      git clone --depth 1 "https://github.com/$ENV:INDEX_REPOSITORY" "$ENV:RUNNER_TEMP/vsm-conan-index"

  - name: Set up local Conan remote
    shell: pwsh
    run: conan remote add conan-index "$ENV:RUNNER_TEMP/vsm-conan-index"
